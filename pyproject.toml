[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m-and-a-technology-integration-factory"
version = "0.1.0"
description = "M&A technology due diligence, Day-1 readiness, TSA exit and integration economics"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
deal-factory = "dealfactory.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

